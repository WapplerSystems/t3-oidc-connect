name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: openssl, json, intl
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: find Classes Configuration Tests -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - run: .Build/bin/phpunit
